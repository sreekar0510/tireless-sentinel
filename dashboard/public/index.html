<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Tireless Sentinel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 28px 40px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .metric-title {
      color: #6b7280;
      font-size: 15px;
    }

    .metric-value {
      font-size: 36px;
      font-weight: 700;
      margin-top: 8px;
    }

    .pass {
      color: #16a34a;
    }

    .healed {
      color: #d97706;
    }

    .bug {
      color: #dc2626;
    }

    .run-row {
      padding: 18px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .run-row:last-child {
      border-bottom: none;
    }

    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .details {
      line-height: 1.8;
      color: #4b5563;
    }

    .memory-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 18px;
      margin-top: 14px;
    }

    code {
      background: #e5e7eb;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
    }

    .empty {
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛡️ Tireless Sentinel</h1>
  <p>Autonomous UI Regression Testing</p>
</header>

<main>
<section class="card">

  <h2>🧪 Test Control Center</h2>

  <p>
    Run a controlled regression scenario.
  </p>

  <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:18px;">

    <button
      onclick="runScenario('baseline')"
      style="padding:12px 18px; border:none; border-radius:8px; cursor:pointer;"
    >
      ✅ Run Baseline
    </button>

    <button
      onclick="runScenario('ui-change')"
      style="padding:12px 18px; border:none; border-radius:8px; cursor:pointer;"
    >
      🔧 Simulate UI Change
    </button>

    <button
      onclick="runScenario('bug')"
      style="padding:12px 18px; border:none; border-radius:8px; cursor:pointer;"
    >
      🐛 Inject Business Bug
    </button>

  </div>

  <div
    id="scenarioStatus"
    style="margin-top:18px;"
  >
    Ready.
  </div>

</section>
  <!-- METRICS -->

  <section class="metrics">

    <div class="card">
      <div class="metric-title">
        Passed
      </div>

      <div
        id="passCount"
        class="metric-value pass"
      >
        0
      </div>
    </div>

    <div class="card">
      <div class="metric-title">
        Healed
      </div>

      <div
        id="healedCount"
        class="metric-value healed"
      >
        0
      </div>
    </div>

    <div class="card">
      <div class="metric-title">
        Bugs
      </div>

      <div
        id="bugCount"
        class="metric-value bug"
      >
        0
      </div>
    </div>

  </section>


  <!-- LATEST RUN -->

  <section class="card">

    <h2>Latest Run</h2>

    <div id="latestRun">
      Loading...
    </div>

  </section>


  <!-- MEMORY -->

  <section class="card">

    <h2>🧠 Application Memory</h2>

    <div id="memory">
      Loading...
    </div>

  </section>


  <!-- RUN HISTORY -->

  <section class="card">

    <h2>📋 Run History</h2>

    <div id="history">
      Loading...
    </div>

  </section>

</main>


<script>

async function loadDashboard() {

  try {

    // -----------------------------------------
    // GET RUNS
    // -----------------------------------------

    const runsResponse =
      await fetch("/api/runs");

    const runs =
      await runsResponse.json();


    // -----------------------------------------
    // GET MEMORY
    // -----------------------------------------

    const memoryResponse =
      await fetch("/api/memory");

    const memory =
      await memoryResponse.json();


    // -----------------------------------------
    // COUNTERS
    // -----------------------------------------

    const passCount =
      runs.filter(
        run => run.status === "PASS"
      ).length;

    const healedCount =
      runs.filter(
        run => run.status === "HEALED"
      ).length;

    const bugCount =
      runs.filter(
        run => run.status === "BUG"
      ).length;


    document.getElementById(
      "passCount"
    ).textContent = passCount;

    document.getElementById(
      "healedCount"
    ).textContent = healedCount;

    document.getElementById(
      "bugCount"
    ).textContent = bugCount;


    // -----------------------------------------
    // LATEST RUN
    // -----------------------------------------

    const latest =
      runs.length > 0
        ? runs[runs.length - 1]
        : null;


    const latestRun =
      document.getElementById(
        "latestRun"
      );


    if (!latest) {

      latestRun.innerHTML =
        `<div class="empty">
          No test runs found.
        </div>`;

    } else {

      let icon = "❓";

      if (latest.status === "PASS") {
        icon = "✅";
      }

      if (latest.status === "HEALED") {
        icon = "🔧";
      }

      if (latest.status === "BUG") {
        icon = "🐛";
      }


      latestRun.innerHTML = `

        <div class="status">
          ${icon}
          ${latest.status}
        </div>

        <div class="details">

          <strong>Scenario:</strong>
          ${latest.scenario || "-"}
          <br>

          <strong>Business validation:</strong>
          ${latest.businessValidation || "-"}
          <br>

          <strong>Original selector:</strong>
          <code>
            ${latest.originalSelector || "-"}
          </code>
          <br>

          <strong>Recovered selector:</strong>
          <code>
            ${latest.recoveredSelector || "-"}
          </code>
          <br>

          <strong>Recovery source:</strong>
          ${latest.recoverySource || "none"}
          <br>

          <strong>AI calls:</strong>
          ${latest.modelCalls ?? 0}
          <br>

          <strong>Duration:</strong>
          ${latest.durationMs ?? 0} ms

          ${
            latest.expectedTotal !== undefined
              ? `
                <br>
                <strong>Expected total:</strong>
                ₹${latest.expectedTotal}

                <br>

                <strong>Actual total:</strong>
                ₹${latest.actualTotal}
              `
              : ""
          }

        </div>
      `;
    }


    // -----------------------------------------
    // MEMORY
    // -----------------------------------------

    const memoryContainer =
      document.getElementById(
        "memory"
      );


    const entries =
      Object.entries(
        memory.elements || {}
      );


    if (entries.length === 0) {

      memoryContainer.innerHTML =
        `<div class="empty">
          No learned recovery patterns.
        </div>`;

    } else {

      memoryContainer.innerHTML =
        entries.map(
          ([key, value]) => `

            <div class="memory-box">

              <strong>
                ${key}
              </strong>

              <div class="details">

                Original:
                <code>
                  ${value.originalSelector || "-"}
                </code>

                <br>

                Current:
                <code>
                  ${value.currentSelector || "-"}
                </code>

                <br>

                Confidence:
                ${value.confidence ?? "-"}

                <br>

                Verified runs:
                ${value.verifiedRuns ?? 0}

              </div>

            </div>
          `
        ).join("");
    }


    // -----------------------------------------
    // RUN HISTORY
    // -----------------------------------------

    const history =
      document.getElementById(
        "history"
      );


    if (runs.length === 0) {

      history.innerHTML =
        `<div class="empty">
          No test history available.
        </div>`;

    } else {

      history.innerHTML =
        runs
          .slice()
          .reverse()
          .map(run => {

            let icon = "❓";

            if (run.status === "PASS") {
              icon = "✅";
            }

            if (run.status === "HEALED") {
              icon = "🔧";
            }

            if (run.status === "BUG") {
              icon = "🐛";
            }

            return `

              <div class="run-row">

                <div class="status">
                  ${icon}
                  ${run.scenario}
                  — ${run.status}
                </div>

                <div class="details">

                  Duration:
                  ${run.durationMs ?? 0} ms

                  ·

                  AI calls:
                  ${run.modelCalls ?? 0}

                  ·

                  Recovery:
                  ${run.recoverySource || "none"}

                </div>

              </div>

            `;

          })
          .join("");
    }


  } catch (error) {

    document.getElementById(
      "latestRun"
    ).innerHTML = `

      <div class="error">

        Dashboard could not load data.

        <br><br>

        ${error.message}

      </div>

    `;

    console.error(error);

  }

}


loadDashboard();

setInterval(
  loadDashboard,
  3000
);

async function runScenario(scenario) {

  const status =
    document.getElementById("scenarioStatus");

  status.textContent =
    `Running ${scenario}...`;

  try {

    const response =
      await fetch(
        `/api/run?scenario=${encodeURIComponent(scenario)}`
      );

    const result =
      await response.json();

    if (!response.ok) {
      throw new Error(
        result.error || "Test execution failed"
      );
    }

    status.textContent =
      `✅ ${scenario} completed.`;

    await loadDashboard();

  } catch (error) {

    status.textContent =
      `❌ ${error.message}`;

    console.error(error);
  }
}

</script>

</body>
</html>
